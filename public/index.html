<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memong 소개</title>
  <style>
    body {
      font-family: 'Helvetica', 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #f9fafc;
      color: #333;
      text-align: center;
    }
    header {
      background: #B5A8FF; /* 메인 색상 */
      color: white;
      padding: 2rem 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }
    main {
      padding: 2rem 1rem;
    }
    main h2 {
      color: #B5A8FF;
    }
    .btn-container {
      margin-top: 2rem;
    }
    a.button {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.9rem 1.5rem;
      background: #B5A8FF;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    a.button:hover {
      background: #8E78FF; /* hover용 진한 톤 */
    }
    /* 이용약관 버튼만 다른 스타일 */
    a.button.terms {
      background: #FFD8DD;  /* 서브 색상 */
      color: #ffffff;       /* 메인 컬러로 글자 */
    }
    a.button.terms:hover {
      background: #ffb6c1;  /* hover 시 조금 더 진한 핑크 */
    }
    footer {
      margin-top: 3rem;
      padding: 1rem;
      background: #B5A8FF;
      font-size: 0.9rem;
      color: #333;
    }
  </style>
</head>
<body>
<header>
  <h1>Memong</h1>
  <p>당신의 일상을 기록하는 스마트 메모 앱</p>
</header>
<main>
  <h2>Memong 소개</h2>
  <p>
    Memong은 간단하면서도 강력한 메모 앱입니다.<br>
    체크박스, 이미지, 그림까지 자유롭게 추가하며<br>
    당신의 아이디어와 하루를 정리하세요.
  </p>

  <div class="btn-container">
    <a href="terms.html" class="button terms">이용약관 보기</a>
    <a href="privacy.html" class="button">개인정보 처리 방침</a>
  </div>
</main>
<footer>
  &copy; 2025 Memong. All rights reserved.
</footer>
</body>
</html>
